name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  # Deployment to AWS runs only when started by hand (Actions tab -> Run workflow),
  # so pushes don't fail when the EC2 runner or AWS secrets are not set up.
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build, push to ECR and deploy to the self-hosted EC2 runner"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit and API tests
        run: pytest -q

  docker:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke-test the image
        run: |
          docker build -t chest-ct-classifier .
          docker run -d --name app -p 8080:8080 chest-ct-classifier
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 3
          done
          docker logs app
          exit 1

  build-and-push-ecr-image:
    name: Continuous Delivery
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull latest image
        run: docker pull ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

      - name: Replace running container
        run: |
          docker rm -f cnncls 2>/dev/null || true
          docker run -d -p 8080:8080 --restart unless-stopped --name=cnncls \
            ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

      - name: Clean up old images
        run: docker image prune -f
