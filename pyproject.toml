[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B904", "B008"]  # B008: FastAPI File()/Query() defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]
